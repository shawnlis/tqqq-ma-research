# Template only. Do not run this file directly.
#
# After Stage 1 completes, copy this file to:
#   configs/tournament_voltarget_stage2.yaml
#
# Then replace the parameter placeholders below with the Stage 1 winner and
# a narrow local neighborhood. The template intentionally has no active
# `strategies` list, so batch/tournament commands cannot run it accidentally.

tournament_name: voltarget_stage2_template
template_only: true
benchmark_symbol: TQQQ
output_dir: outputs/tournament_voltarget_stage2
max_estimated_runtime_seconds: 3600
report_type: voltarget_stage2
execution_models:
  - close_to_close_shifted
walk_forward_variants:
  - name: standard_5y_1y
    train_years: 5
    test_years: 1
  - name: alternate_3y_1y
    train_years: 3
    test_years: 1
  - name: alternate_7y_1y
    train_years: 7
    test_years: 1
cost_scenarios: [10.0, 25.0, 50.0]

stage2_fill_from_stage1:
  best_target_ann_vol: REPLACE_WITH_STAGE1_WINNER
  best_realized_vol_window: REPLACE_WITH_STAGE1_WINNER
  best_max_exposure: REPLACE_WITH_STAGE1_WINNER
  best_min_exposure: REPLACE_WITH_STAGE1_WINNER

