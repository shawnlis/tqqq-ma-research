experiment_name: vol_target_governor
symbols: [TQQQ, QQQ]
start_date: "2011-01-01"
end_date:
strategy_name: vol_target
parameter_grid:
  target_ann_vol: [0.75]
  realized_vol_window: [20]
  min_exposure: [0.50]
  max_exposure: [1.50]
  trend_window: [150]
  momentum_window: [63]
  trend_multiplier_below_ma: [0.50]
  momentum_boost: [1.15]
  crash_vol_cutoff: [0.050]
  crash_exposure: [0.25]
  use_rebound_module: [false]
  use_drawdown_governor: [true]
  portfolio_dd_trigger: [-0.20, -0.30, -0.40]
  qqq_dd_trigger: [-0.10, -0.15, -0.20]
  reduced_exposure: [0.25, 0.50, 0.75]
  recovery_ma_window: [10, 20, 50]
  recovery_momentum_window: [5, 10, 20]
  recovery_momentum_threshold: [0.03, 0.05, 0.08]
  max_days_reduced: [20, 40, 63, 126]
benchmark_symbol: TQQQ
transaction_cost_bps: 10.0
train_years: 5
test_years: 1
objective: objective_final_ratio
objectives:
  - objective_final_ratio
  - objective_excess_cagr_with_dd_guard
output_dir: outputs/vol_target_governor

