experiment_name: regime_with_rebound
symbols: [TQQQ, QQQ]
start_date: "2011-01-01"
end_date:
strategy_name: regime
parameter_grid:
  trend_windows: [200]
  momentum_windows: [40]
  vol_windows: [20]
  trend_on_levels: [0.0]
  trend_off_levels: [-0.01]
  mom_on_levels: [0.0]
  mom_off_levels: [-0.02]
  vol_caps: [0.022]
  risk_on_leverages: [1.0]
  risk_off_qqq_positions: [1.0]
  transition_positions: [0.25, 0.40]
  min_hold_days_options: [3]
  cooldown_days_options: [0, 2]
  use_rebound_module: [true]
  rolling_high_window: [63, 126, 252]
  drawdown_trigger: [-0.15, -0.20, -0.30]
  rebound_momentum_window: [5, 10, 20]
  rebound_momentum_threshold: [0.03, 0.05, 0.08]
  reclaim_ma_window: [10, 20, 50]
  rebound_position: [1.00, 1.25, 1.50]
  rebound_hold_days: [5, 10, 20]
benchmark_symbol: TQQQ
transaction_cost_bps: 10.0
train_years: 5
test_years: 1
objective: objective_final_ratio
objectives:
  - objective_final_ratio
  - objective_excess_cagr_with_dd_guard
output_dir: outputs/regime_with_rebound

